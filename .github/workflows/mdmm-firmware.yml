name: MD/MM firmware tests

# The tests that need the user's Elektron ROMs (doc/release/CI.md, "Firmware tests on CI"). The ROMs are never in the
# repository, a secret or an artifact: each job fetches them for its own run from the ROM Worker (ci/rom-worker), which
# hands them only to a run of THIS workflow on main or release/*, in the `rom` environment, proven by the run's GitHub
# OIDC token (aud mdmm-rom). No long-lived secret exists. The images live in the runner's temp folder, are checked
# against the SHA-256 pinned in scripts/macos/build_mdmm.sh, and are deleted at the end of the job (if: always()).
#
# Never add pull_request or pull_request_target here: a pull request's code would run next to the ROMs. The Worker
# refuses those tokens too, so a mistake here fails closed.
#
#   changes     which files the push changed: decides whether anything below runs (main: source, scripts, cmake, ci, tests,
#               this file; release/**: everything but docs)
#   build-tests the arm64 ctest tree without ThinLTO, built once, no ROM on this runner (or taken from the caller's stage 2)
#   build-e2e   the diagnostics build of the two standalone editors for the journeys, built once, no ROM
#   firmware    four shards of every ctest test labelled FirmwareTest (not Slow/Soak); each only tests the built tree
#   e2e         the firmware E2E, one job per machine (md, mm), each on the built editors
#
# Also a building block: `workflow_call` from mdmm-ci.yml (doc/release/CI-LAYOUT.md, stage 3). The ROM Worker reads the
# job_workflow_ref claim, which is this file, and the event of the caller (push, workflow_dispatch), so it works the same.

on:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:
    inputs:
      what:
        description: "Which jobs: both, firmware or e2e"
        default: both
      e2e_args:
        description: "Arguments of scripts/mdmm-e2e.sh after the machine and --no-build (default: --jobs 1); e.g. '--jobs 1 --select md-keys-space-play'"
        default: ""
  workflow_call:
    inputs:
      build_tree_artifact:
        description: "Artifact (a build-tree.tar.gz holding build/) of a prebuilt macOS ctest tree to test; empty: build it here"
        type: string
        default: ""
  schedule:
    - cron: "30 2 * * *"   # after the nightly full suite (02:00 UTC); main only (schedules run on the default branch)

permissions:
  contents: read
  id-token: write

# main: a newer push replaces the run; release/**: queue (a run of 80 minutes is not killed). A dispatch or a nightly
# never cancels a push run, and the other way round. Under workflow_call the caller's group applies.
concurrency:
  group: mdmm-firmware-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/release/') }}

env:
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: "%compiler% -v"
  CCACHE_SLOPPINESS: "include_file_mtime,include_file_ctime,time_macros,pch_defines"
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: "true"

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          run=true
          if [ "${EVENT}" = push ] && [ -n "${BEFORE}" ] && ! [[ "${BEFORE}" =~ ^0+$ ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}")"
            if [[ "${REF}" == refs/heads/release/* ]]; then
              # everything but documentation and the site
              rest="$(printf '%s\n' "${files}" | grep -v -E '^(doc/|site/)|\.md$' || true)"
              [ -n "${rest}" ] || run=false
            else
              rest="$(printf '%s\n' "${files}" | grep -E '^(source/|scripts/|ci/|CMakeLists\.txt$|base\.cmake$|.*\.cmake$|\.github/workflows/mdmm-firmware\.yml$)' || true)"
              [ -n "${rest}" ] || run=false
            fi
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"
          echo "firmware workflow runs: ${run}"

  build-tests:
    name: Build the test tree (macOS arm64)
    needs: changes
    if: needs.changes.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.what != 'e2e') && inputs.build_tree_artifact == ''
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Install ccache and Ninja
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install ccache ninja
          echo "CCACHE_DIR=${RUNNER_TEMP}/ccache" >> "${GITHUB_ENV}"

      # The unit-test job's cache (same tree, same flags): read it, save under this workflow's own key.
      - name: Restore the compiler cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v1-macos15-arm64-tests-fw-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-v1-macos15-arm64-tests-fw-${{ github.ref_name }}-
            ccache-v1-macos15-arm64-tests-${{ github.ref_name }}-
            ccache-v1-macos15-arm64-tests-main-

      - name: Configure (arm64, Release, no ThinLTO, no PGO)
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 -DXCODE_VERSION=16 \
            -DGEARMULATOR_MDMM_APPLE_THINLTO=OFF -DGEARMULATOR_MDMM_APPLE_PGO_MODE=none \
            -DBUILD_TESTING=ON -DMDMM_FW_TIMEOUT_SCALE=3 -Dgearmulator_BUILD_JUCEPLUGIN=ON -Dgearmulator_BUILD_JUCEPLUGIN_VST3=ON \
            -Dgearmulator_BUILD_JUCEPLUGIN_AU=ON -Dgearmulator_BUILD_JUCEPLUGIN_Standalone=ON

      - name: Build
        run: |
          set -euo pipefail
          home="${RUNNER_TEMP}/test-home"
          mkdir -p "${home}/Documents"
          HOME="${home}" GEARMULATOR_DATA_ROOT="${home}/Documents/" cmake --build build --parallel 4

      # The tree without its object files: the shards only run ctest in it (same path on every runner, so the absolute
      # paths inside it hold). No ROM is anywhere near this job.
      - name: Pack the tree
        run: |
          set -euo pipefail
          tar --exclude='*.o' --exclude='*.a' --exclude='.ninja_*' --exclude='*.pch' --exclude='*.gch' -czf "${RUNNER_TEMP}/build-tree.tar.gz" build
          ls -lh "${RUNNER_TEMP}/build-tree.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fw-test-tree
          path: ${{ runner.temp }}/build-tree.tar.gz
          retention-days: 2

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v1-macos15-arm64-tests-fw-${{ github.ref_name }}-${{ github.run_id }}

  firmware:
    name: Firmware tests (ctest ${{ matrix.shard }}/4, macOS arm64)
    needs: [changes, build-tests]
    if: always() && needs.changes.outputs.run == 'true' && (needs.build-tests.result == 'success' || (needs.build-tests.result == 'skipped' && inputs.build_tree_artifact != '')) && (github.event_name != 'workflow_dispatch' || inputs.what != 'e2e')
    runs-on: macos-15
    environment: rom
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      MDMM_ROM_URL: ${{ vars.MDMM_ROM_URL }}
    steps:
      # the sources: the tests read goldens and scripts from the checkout; the objects are not needed
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.build_tree_artifact != '' && inputs.build_tree_artifact || 'fw-test-tree' }}
          path: ${{ runner.temp }}/tree

      - name: Unpack the tree
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}"/tree/build-tree.tar.gz
          mkdir -p "${RUNNER_TEMP}/test-home/Documents"
          ctest --test-dir build -N | tail -n 2

      - name: Fetch the ROMs
        run: scripts/ci-fetch-roms.sh "${RUNNER_TEMP}/roms"

      # A quarter of the tests per runner (ctest -I shard,,4), one at a time: the emulation needs about a core each and
      # the runner has three. mdSysexLifecycleTest is left out: it needs the Monomachine factory patch RAM
      # (mm-factory-live3-be.bin), which exists on no machine we have (doc/release/LOCAL-GATE.md); the local gate leaves it out too.
      - name: Run the firmware tests
        env:
          GEARMULATOR_REQUIRE_FIRMWARE_TESTS: "1"
          MD_AUTOMATION_REQUIRE_FIRMWARE: "1"
          MDMM_LOCK_HOLD_BUDGET_MS: "10"
        run: |
          set -euo pipefail
          home="${RUNNER_TEMP}/test-home"
          log="${RUNNER_TEMP}/firmware-ctest.log"
          set +e
          HOME="${home}" GEARMULATOR_DATA_ROOT="${home}/Documents/" ctest --test-dir build -L FirmwareTest -LE 'Slow|Soak' \
            -E '^mdSysexLifecycleTest$' -I "${{ matrix.shard }},,4" \
            -j1 --output-on-failure --no-tests=error 2>&1 | tee "${log}"
          status=${PIPESTATUS[0]}
          set -e
          # A skip (exit 77) means "no ROM here": on this workflow that is a hole, not a pass.
          if grep -Eq '\*\*\*Skipped|Not Run' "${log}"; then
            echo "::error title=Skipped firmware tests::a firmware test skipped although the ROMs are present"
            grep -E '\*\*\*Skipped|Not Run' "${log}" || true
            status=1
          fi
          exit "${status}"

      - name: Delete the ROMs (before anything is uploaded)
        if: always()
        run: rm -rf "${RUNNER_TEMP}/roms"

      # Test output only: the logs carry no firmware bytes (the tests read the image, they do not print it).
      - name: Keep the ctest log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-ctest-log-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/firmware-ctest.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  build-e2e:
    name: Build the editors (diagnostics, macOS)
    needs: changes
    if: needs.changes.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.what != 'firmware')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Install ccache and Ninja
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install ccache ninja
          echo "CCACHE_DIR=${RUNNER_TEMP}/ccache" >> "${GITHUB_ENV}"

      - name: Restore the compiler cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v1-macos15-e2e-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-v1-macos15-e2e-${{ github.ref_name }}-
            ccache-v1-macos15-e2e-main-

      # The dev tree (diagnostics on: the journeys need it), the two standalones only.
      - name: Build the editors
        run: |
          set -euo pipefail
          home="${RUNNER_TEMP}/build-home"
          mkdir -p "${home}/Documents"
          HOME="${home}" ./scripts/mdmm-dev.sh build mdJucePlugin_Standalone mmJucePlugin_Standalone

      - name: Pack the tree
        run: |
          set -euo pipefail
          tar --exclude='*.o' --exclude='*.a' --exclude='.ninja_*' --exclude='*.pch' --exclude='*.gch' -czf "${RUNNER_TEMP}/editors-tree.tar.gz" temp/dev
          ls -lh "${RUNNER_TEMP}/editors-tree.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fw-editors-tree
          path: ${{ runner.temp }}/editors-tree.tar.gz
          retention-days: 2

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v1-macos15-e2e-${{ github.ref_name }}-${{ github.run_id }}

  e2e:
    name: Firmware E2E (${{ matrix.machine }} editor, macOS)
    needs: [changes, build-e2e]
    if: needs.changes.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.what != 'firmware')
    runs-on: macos-15
    environment: rom
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        machine: [md, mm]
    env:
      MDMM_ROM_URL: ${{ vars.MDMM_ROM_URL }}
      MDMM_E2E_OUT: ${{ github.workspace }}/temp/e2e-out
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fw-editors-tree
          path: ${{ runner.temp }}/tree

      - name: Unpack the editors
        run: tar -xzf "${RUNNER_TEMP}"/tree/editors-tree.tar.gz

      - name: Fetch the ROMs
        run: scripts/ci-fetch-roms.sh "${RUNNER_TEMP}/roms"

      # What the runner is: cores, displays, audio devices, the session. Kept in the report for the next failure.
      - name: Describe the runner
        run: |
          mkdir -p "${MDMM_E2E_OUT}"
          {
            sw_vers; sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string; whoami; launchctl managername || true
            system_profiler SPAudioDataType SPDisplaysDataType 2>&1 | head -n 80
            pgrep -l WindowServer || echo "no WindowServer"
          } > "${MDMM_E2E_OUT}/runner.txt" 2>&1 || true
          cat "${MDMM_E2E_OUT}/runner.txt"

      - name: Install Pillow (the report's pictures)
        run: python3 -m pip install --break-system-packages pillow

      - name: Run the firmware E2E
        env:
          E2E_ARGS: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_args || '' }}
        run: |
          # shellcheck disable=SC2086
          ./scripts/mdmm-e2e.sh ${{ matrix.machine }} ${E2E_ARGS:---jobs 1} --no-build

      - name: Delete the ROMs (before anything is uploaded)
        if: always()
        run: rm -rf "${RUNNER_TEMP}/roms"

      # Reports and logs only. No folder that can hold the ROM (the sandboxes link it) is uploaded: the files are
      # copied by type and size into a staging folder first.
      - name: Stage the report
        if: always()
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/e2e-report"
          rm -rf "${stage}"; mkdir -p "${stage}"
          if [ -d "${MDMM_E2E_OUT}" ]; then
            (cd "${MDMM_E2E_OUT}" && find . -type f ! -type l -size -4M \
              \( -name '*.log' -o -name '*.txt' -o -name '*.json' -o -name '*.jsonl' -o -name '*.out' -o -name '*.html' -o -name '*.png' -o -name '*.webp' \) \
              -print0 | cpio -pdm0 "${stage}" 2>&1 | tail -n 3)
          fi
          du -sh "${stage}"

      - name: Keep the E2E report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report-${{ matrix.machine }}
          path: ${{ runner.temp }}/e2e-report
          if-no-files-found: ignore
          retention-days: 14
