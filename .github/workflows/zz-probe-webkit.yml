name: zz probe webkit (temporary)
on:
  push:
    branches: [feat/linux-windows-release]
    paths: [".github/workflows/zz-probe-webkit.yml", "scripts/linux/probe_webkit_bridge.py"]
jobs:
  probe:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mode: [pending, answered, file]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-gi gir1.2-webkit2-4.0 gir1.2-gtk-3.0
      - run: |
          for i in 1 2 3 4 5; do
            xvfb-run -a python3 scripts/linux/probe_webkit_bridge.py ${{ matrix.mode }} 300 2>&1 | grep -E "RESULT|TERMINATED|LOAD-FAILED" || true
          done
          sudo dmesg | grep -i segfault || echo "no segfault in the kernel log"
