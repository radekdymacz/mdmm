name: MD/MM nightly full suite

# The full suite on main once a night, only when main changed in the last 24 hours (doc/release/CI.md): a push to
# main runs one light Linux job, so a Windows or macOS break would otherwise wait for the next release branch.
# Nobody waits for it; a red run is there in the morning. It starts the two workflows by hand on main
# (workflow_dispatch), so each one's own run, logs and re-run button stay where they always are.
# 02:00 UTC = 04:00 in Poland in summer time (03:00 in winter time).

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  start:
    name: Start the full suite on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Did main change in the last 24 hours?
        id: changed
        run: |
          set -euo pipefail
          last="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.commit.committer.date')"
          age=$(( $(date -u +%s) - $(date -u -d "${last}" +%s) ))
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || ${age} -lt 86400 ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            echo "main's last commit: ${last}: running the full suite"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=Nothing new::main has not changed since ${last}"
          fi
      - name: Start the full suite (the Editors, the core)
        if: steps.changed.outputs.run == 'true'
        run: |
          set -euo pipefail
          # the Editors with ltcg: Windows builds what a release ships (/GL, /LTCG) on main, so main's sccache holds
          # those objects: a release branch reads main's cache (GitHub's cache scope), and its LTCG package found
          # 45 % of them before (doc/release/DEV-CYCLE.md). The tests job warms the plain (/GL-) objects beside it.
          gh workflow run mdmm-editors.yml --repo "${GITHUB_REPOSITORY}" --ref main -f ltcg=true
          echo "started mdmm-editors.yml (ltcg)"
          gh workflow run mdmm-core.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo "started mdmm-core.yml"
