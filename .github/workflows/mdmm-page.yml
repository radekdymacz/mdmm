name: MD/MM page suite

# The ROM-free page suite on Linux (doc/release/CI.md): the node page unit tests and every page-tier journey of both
# editors, in headless Chrome against the editors' real core (deskStubHost). No JUCE build, no emulator, no ROM.

on:
  pull_request:
    paths:
      - ".github/workflows/mdmm-page.yml"
      - "scripts/**"
      - "doc/modern-ux/*schema*"
      - "doc/modern-ux/intent-cases.json"
      - "source/elektron/md/**"
      - "source/baseLib/**"
      - "CMakeLists.txt"
      - "base.cmake"
      - "source/*.cmake"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: mdmm-page-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page-suite:
    name: page suite (stub host, headless Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache libasound2-dev libgl1-mesa-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype6-dev

      - name: Compiler cache folder
        run: echo "CCACHE_DIR=${RUNNER_TEMP}/ccache" >> "${GITHUB_ENV}"

      - name: Restore the compiler cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v1-page-linux-x64-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-v1-page-linux-x64-${{ github.ref_name }}-
            ccache-v1-page-linux-x64-main-

      # The JUCE plug-in is switched on only so CMake registers the node page tests (label Page); no plug-in target
      # is built: the only build is deskStubHost.
      - name: Configure
        run: |
          cmake -S . -B build-page -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -Dgearmulator_BUILD_JUCEPLUGIN=ON \
            -Dgearmulator_BUILD_JUCEPLUGIN_VST3=OFF \
            -Dgearmulator_BUILD_JUCEPLUGIN_AU=OFF \
            -Dgearmulator_BUILD_JUCEPLUGIN_Standalone=OFF

      - name: Build deskStubHost and mmDataCorpusTest
        run: |
          ccache --zero-stats > /dev/null
          cmake --build build-page --parallel 4 --target deskStubHost mmDataCorpusTest

      - name: Node page unit tests
        run: ctest --test-dir build-page -L Page -j 4 --output-on-failure --no-tests=error

      - name: Page journeys (both editors, page tier)
        env:
          MDMM_STUB_HOST: ${{ github.workspace }}/build-page/source/elektron/md/deskStubHost/deskStubHost
          MDMM_CHROME: /usr/bin/google-chrome
          MDMM_CHROME_ARGS: --no-sandbox --disable-dev-shm-usage --font-render-hinting=none
          MDMM_PAGE_OUT: ${{ github.workspace }}/page-run
        run: |
          test -x "${MDMM_STUB_HOST}"
          # Excluded on CI only, each for a reason (doc/release/CI.md, "Page suite exclusions"): they measure text
          # against its box to the pixel, and Linux Chrome sets the text a few pixels wider than the Mac's.
          node scripts/mdmm-page.mjs --tier page --jobs 3 both "journey-*,!md-screens-fit,!mm-global-page"

      - name: Compiler cache statistics
        if: always()
        run: |
          { echo "### ccache (page suite)"; echo '```'; ccache --show-stats; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the run folder
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: page-run
          path: page-run
          retention-days: 14

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-v1-page-linux-x64-${{ github.ref_name }}-${{ github.run_id }}
