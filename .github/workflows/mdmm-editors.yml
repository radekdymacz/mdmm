name: MD/MM Editors

# The one build-and-test of a push (doc/modern-ux/FOUNDATION.md, "Build and check" and "CI start tests"): each
# system is built once, with a compiler cache, and the start tests and pluginval run on exactly what was built:
#   mdmm-editors-macos.yml    universal package (macos-15) -> start test + auval + pluginval on macos-14 and -15
#   mdmm-editors-windows.yml  x64 package (LTCG only for a release) -> start test + pluginval; unit tests in parallel (no /GL)
#   mdmm-editors-linux.yml    x64 archives (22.04, unit tests) -> start test + pluginval on 22.04 and 24.04
# Stage 2 of mdmm-ci.yml (doc/release/CI.md) calls this workflow for every push to main and release/**; the only
# push trigger left here is for the windows and linux feature branches. The packages stay as the artifacts of that
# run (macos-mdmm-universal, windows-mdmm, linux-mdmm; 30 days on a release branch, else 14). A tag's release
# (mdmm-editors-release.yml) takes them from the green mdmm-ci run of the tag's commit instead of building again.

on:
  workflow_call:
    inputs:
      ltcg:
        description: Windows with whole-program optimisation (/GL, /LTCG), for a release
        type: boolean
        default: false
      build_tree:
        description: Keep the macOS test tree for the firmware stage (artifact macos-build-tree)
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ltcg:
        description: Windows with whole-program optimisation (/GL, /LTCG)
        type: boolean
        default: false
  push:
    branches:
      - "feat/windows-*"
      - "feat/linux-*"
    paths:
      - ".github/workflows/mdmm-editors.yml"
      - ".github/workflows/mdmm-editors-macos.yml"
      - ".github/workflows/mdmm-editors-windows.yml"
      - ".github/workflows/mdmm-editors-linux.yml"
      - "scripts/ci/**"
      - "scripts/pluginval.env"
      - "scripts/macos/**"
      - "scripts/windows/**"
      - "scripts/linux/**"
      - "scripts/vst3EditorHost/**"
      - "scripts/mdmm-product.env"
      - ".gitmodules"
      - "CMakeLists.txt"
      - "base.cmake"
      - "xcodeversion.cmake"
      - "source/CMakeLists.txt"
      - "source/*.cmake"
      - "source/JUCE"
      - "source/3rdparty/**"
      - "source/elektron/**"
      - "source/baseLib/**"
      - "source/hardwareLib/**"
      - "source/synthLib/**"
      - "source/jucePluginData/**"
      - "source/jucePluginEditorLib/**"
      - "source/jucePluginLib/**"
      - "source/juceUiLib/**"
      - "source/juceRmlUi/**"
      - "source/juceRmlPlugin/**"
      - "source/libresample/**"
      - "source/pluginTester/**"
      - "source/dsp56300"
      - "source/mc68k"

permissions:
  contents: read

# A newer push to the same branch cancels the older run; a dispatch or a call from the release never does.
concurrency:
  group: mdmm-editors-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  macos:
    uses: ./.github/workflows/mdmm-editors-macos.yml
    with:
      build_tree: ${{ inputs.build_tree || false }}

  windows:
    uses: ./.github/workflows/mdmm-editors-windows.yml
    with:
      # A release branch builds what ships (LTCG), so the tag on that commit reuses this run instead of building again.
      ltcg: ${{ inputs.ltcg || startsWith(github.ref, 'refs/heads/release/') }}

  linux:
    uses: ./.github/workflows/mdmm-editors-linux.yml
