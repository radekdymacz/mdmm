name: MD/MM automation core

on:
  pull_request:
    paths:
      - ".github/workflows/mdmm-core.yml"
      - "scripts/mdmm-ci-unit-targets.py"
      - ".gitmodules"
      - "CMakeLists.txt"
      - "base.cmake"
      - "xcodeversion.cmake"
      - "source/CMakeLists.txt"
      - "source/*.cmake"
      - "source/3rdparty/**"
      - "source/JUCE"
      - "source/baseLib/**"
      - "source/dsp56300"
      - "source/dsp56300/**"
      - "source/elektron/CMakeLists.txt"
      - "source/elektron/md/**"
      - "source/hardwareLib/**"
      - "source/jucePluginData/**"
      - "source/jucePluginEditorLib/**"
      - "source/jucePluginLib/**"
      - "source/juceRmlPlugin/**"
      - "source/juceRmlUi/**"
      - "source/juceUiLib/**"
      - "source/libresample/**"
      - "source/mc68k"
      - "source/mc68k/**"
      - "source/pluginTester/**"
      - "source/synthLib/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      modes:
        description: 'JSON list of build modes: release, transport-diagnostics, asan-ubsan'
        type: string
        default: '["release"]'

permissions:
  contents: read

concurrency:
  group: mdmm-core-${{ github.workflow }}-${{ github.ref }}-${{ inputs.modes }}
  cancel-in-progress: true

jobs:
  fixture-free:
    name: fixture-free (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "mdmm-v1-linux-x64-gcc"
    strategy:
      fail-fast: false
      matrix:
        # Exercise the JUCE-without-shipping-formats configuration before merge.
        # mdmm-ci.yml passes the modes: stage 1 the one light build (unit tests, no memory checker), and on release
        # branches stage 2 the other two. Pull requests and hand runs get all three (doc/release/CI.md).
        mode: ${{ fromJSON(inputs.modes || '["release", "transport-diagnostics", "asan-ubsan"]') }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev libgl1-mesa-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype6-dev

      - name: Configure
        shell: bash
        run: |
          sanitizer_flags=""
          if [[ "${{ matrix.mode }}" == "asan-ubsan" ]]; then
            sanitizer_flags="-fsanitize=address,undefined -fno-omit-frame-pointer"
          fi
          cmake -S . -B build-mdmm-core -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="${sanitizer_flags}" \
            -DCMAKE_EXE_LINKER_FLAGS="${sanitizer_flags}" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBUILD_TESTING=ON \
            -DMD_TRANSPORT_DIAGNOSTICS=${{ matrix.mode == 'transport-diagnostics' && 'ON' || 'OFF' }} \
            -Dgearmulator_BUILD_JUCEPLUGIN=${{ matrix.mode != 'transport-diagnostics' && 'ON' || 'OFF' }} \
            -Dgearmulator_BUILD_JUCEPLUGIN_VST3=OFF \
            -Dgearmulator_BUILD_JUCEPLUGIN_AU=OFF \
            -Dgearmulator_BUILD_JUCEPLUGIN_Standalone=OFF

      - name: Build and run panel input delivery regression
        run: |
          cmake --build build-mdmm-core --parallel 4 --target mdLibTest
          ctest --test-dir build-mdmm-core -C Release --output-on-failure \
            --no-tests=error --tests-regex '^(mdLibTests|mdEncoderPressFirmwareTest|mmEncoderPressFirmwareTest)$'

      - name: Build and run enabled transport diagnostics gates
        if: matrix.mode == 'transport-diagnostics'
        run: |
          cmake --build build-mdmm-core --parallel 4 --target mdTransportScorecardTest mdTransportScorecardFirmwareTest
          ctest --test-dir build-mdmm-core -C Release --output-on-failure \
            --no-tests=error --tests-regex '^(mdTransportScorecardTest|mdTransportScorecardFirmwareTest)$'

      - name: Build headless gates
        run: >-
          cmake --build build-mdmm-core --parallel 4 --target
          baseLibBinaryStreamTest
          midiRoutingMatrixTest
          mdAutomationMidiTest
          synthLibAudioTest
          synthLibMidiQueueTest
          synthLibStateCaptureTest
          synthLibDeviceCommandTest
          synthLibSeqlockTest
          mdAudioQueueTest
          mdAudioFirmwareTest
          mdStateTest
          mdStateCaptureTest
          mdMemoryFastLaneTest
          mdFlashTest

      - name: Run DSP accumulator regressions
        if: matrix.mode == 'release'
        run: |
          cmake --build build-mdmm-core --parallel 4 --target dsp56kAccumulatorTests
          ctest --test-dir build-mdmm-core -C Release --output-on-failure \
            --no-tests=error --tests-regex '^dsp56300_accumulatorTests$'

      - name: Build deep JUCE sanitizer gates
        if: matrix.mode == 'asan-ubsan'
        run: >-
          cmake --build build-mdmm-core --parallel 4 --target
          midiOutputDispatcherTest
          mdAutomationParameterTest
          mdAutomationRobustnessTest
          mdAudioIoLayoutTest
          mdProcessorHooksTest
          mdWindowsPolicyTest
          mdMachineMidiOutTest
          mdProcessArchTest
          mdRosettaNoticeTest
          mdDroppedFilesTest

      - name: Run headless gates
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          ctest --test-dir build-mdmm-core -C Release --output-on-failure
          --no-tests=error
          --tests-regex
          '^(baseLibBinaryStreamTest|midiRoutingMatrixTest|mdAutomationMidiTest|synthLibAudioTest|synthLibMidiQueueTest|synthLibStateCaptureTest|synthLibDeviceCommandTest|synthLibSeqlockTest|mdAudioQueueTest|mdAudioFirmwareTest|mdStateTest|mdStateCaptureTest|mdMemoryFastLaneTest|mdFlashTest)$'

      # Every ROM-free unit test, picked by CTest label (UnitTest) rather than by name, so a new test is in by
      # default (scripts/mdmm-ci-unit-targets.py: what is left out and why). The JUCE plug-in is configured with
      # every format off, only so that its unit tests (mdPageBridgeTest, ...) are registered.
      - name: Build and run every ROM-free unit test
        if: matrix.mode != 'transport-diagnostics'
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mapfile -t targets < <(python3 scripts/mdmm-ci-unit-targets.py build-mdmm-core)
          cmake --build build-mdmm-core --parallel 4 --target "${targets[@]}"
          ctest --test-dir build-mdmm-core -C Release --output-on-failure --no-tests=error \
            --tests-regex "$(python3 scripts/mdmm-ci-unit-targets.py build-mdmm-core --tests)"

      - name: Build and run realtime instrumentation gate
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cmake --build build-mdmm-core --parallel 4 --target synthLibRealtimeInstrumentationTest synthLibPerformanceReportTest synthLibAudioTest
          ctest --test-dir build-mdmm-core -C Release --output-on-failure \
            --no-tests=error --tests-regex '^(synthLibRealtimeInstrumentationTest|synthLibPerformanceReportTest|synthLibAudioInstrumentationTest)$'

      - name: Run deep JUCE sanitizer gates
        if: matrix.mode == 'asan-ubsan'
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          ctest --test-dir build-mdmm-core -C Release --output-on-failure
          --no-tests=error
          --tests-regex
          '^(midiOutputDispatcherTest|mdAutomationParameterTest|mdAutomationArchitectureTest|mdAudioIoLayoutTest|mdProcessorHooksTest|mdWindowsPolicyTest|mdMachineMidiOutTest|mdProcessArchTest|mdRosettaNoticeTest|mdDroppedFilesTest|deskDropPageTest)$'
